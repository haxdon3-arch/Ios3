name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xzf - -C $HOME/theos/sdks --strip-components=1

      - name: Compile Dylib
        env:
          THEOS: ${{ runner.temp }}/../../Users/runner/theos
        run: |
          export THEOS=$HOME/theos
          make clean
          make

      - name: Upload InstantNoAds.dylib
        uses: actions/upload-artifact@v4
        with:
          name: InstantNoAds-Dylib
          path: .theos/obj/debug/arm64/InstantNoAds.dylib
